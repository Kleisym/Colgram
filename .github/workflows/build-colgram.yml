name: Build Colgram (Automated Privacy Telegram)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # Check for upstream Telegram updates daily at 04:00 UTC
    - cron: '0 4 * * *'

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Colgram APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Colgram Mod Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Clone Telegram Upstream (Official Base)
        run: |
          echo "Cloning latest Telegram release from DrKLO/Telegram..."
          git clone --depth 1 https://github.com/DrKLO/Telegram.git Telegram-Src
          cd Telegram-Src
          UPSTREAM_TAG=$(git describe --tags --always)
          echo "UPSTREAM_TAG=$UPSTREAM_TAG" >> $GITHUB_ENV
          echo "Base Telegram Tag: $UPSTREAM_TAG"

      - name: Apply Colgram Core & Surgical Patches
        run: |
          python3 scripts/apply-patches.py Telegram-Src

      - name: Audit Privacy & Check for Trackers
        run: |
          python3 scripts/verify-privacy.py Telegram-Src

      - name: Build Colgram APK
        run: |
          cd Telegram-Src
          chmod +x gradlew
          ./gradlew assembleAppStandaloneRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError"

      - name: Sign APK (Production / Self-Signed)
        run: |
          # Generate signing keystore
          keytool -genkey -v -keystore colgram.keystore -storepass colgrampass -alias colgramkey -keypass colgrampass -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Colgram,O=Colgram,C=US"
          
          # Find latest apksigner
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner at: $APKSIGNER"
          
          # Find unsigned APK
          UNSIGNED_APK=$(find Telegram-Src -name "*.apk" | head -n 1)
          echo "Target APK: $UNSIGNED_APK"
          
          if [ -f "$UNSIGNED_APK" ]; then
            $APKSIGNER sign --ks colgram.keystore --ks-pass pass:colgrampass --key-pass pass:colgrampass --out colgram-signed-release.apk "$UNSIGNED_APK"
            echo "Successfully signed: colgram-signed-release.apk"
          else
            echo "No APK found to sign!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Colgram-Release-APK
          path: colgram-signed-release.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        uses: softprops/action-gh-release@v1
        with:
          files: colgram-signed-release.apk
          tag_name: colgram-${{ env.UPSTREAM_TAG }}-${{ github.run_number }}
          name: Colgram v${{ env.UPSTREAM_TAG }} (Build ${{ github.run_number }})
          body: |
            ## Colgram Automated Release
            - **Telegram Base**: `${{ env.UPSTREAM_TAG }}` (Official `DrKLO/Telegram`)
            - **Hardware Cloaking**: Enabled (Spoofed device & OS info)
            - **Anti-Delete Vault**: Active (Preserves deleted messages & edit logs)
            - **Ghost Mode**: Silent read, stealth typing, offline status, FLAG_SECURE bypass
            - **Storage Sandbox**: Scoped to isolated folder
            - **Built-in MTProto**: Fake-TLS anti-censorship pool active
            - **Telemetry**: 100% Stripped (No Firebase / Play Services / HMS)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
