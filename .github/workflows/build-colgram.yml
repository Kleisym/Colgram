name: Build Colgram (Automated Privacy Telegram)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      telegram_version:
        description: 'Telegram Upstream Tag or Branch (default: master / latest)'
        required: false
        default: 'latest'
      release_label:
        description: 'Optional label appended to the release name (e.g. "12.10.3-fixview")'
        required: false
        default: ''
  schedule:
    # Check for upstream Telegram updates daily at 04:00 UTC
    - cron: '0 4 * * *'

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Colgram APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Colgram Mod Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Clone Telegram Upstream (Official Base)
        run: |
          TARGET_VERSION="${{ inputs.telegram_version || 'latest' }}"
          echo "Target Telegram version: $TARGET_VERSION"
          if [ "$TARGET_VERSION" = "latest" ] || [ -z "$TARGET_VERSION" ]; then
            echo "Cloning latest Telegram release from DrKLO/Telegram..."
            git clone --depth 1 --no-tags --single-branch https://github.com/DrKLO/Telegram.git Telegram-Src
          else
            echo "Cloning specific Telegram version $TARGET_VERSION from DrKLO/Telegram..."
            git clone --depth 1 --no-tags --single-branch --branch "$TARGET_VERSION" https://github.com/DrKLO/Telegram.git Telegram-Src
          fi
          cd Telegram-Src
          git submodule update --init --depth 1 TMessagesProj_Modules/media TMessagesProj/lib/jlatexmath
          # Record which base actually got built. On a specific tag this is the tag;
          # on 'latest' fall back to the commit we landed on so the release is still
          # traceable to an exact upstream revision.
          UPSTREAM_TAG=$(git describe --tags --always 2>/dev/null || git rev-parse --short HEAD)
          echo "UPSTREAM_TAG=$UPSTREAM_TAG" >> $GITHUB_ENV
          echo "Base Telegram Tag: $UPSTREAM_TAG"

          # Keep the requested tag separately from the resolved one, so the release
          # notes can show both what was asked for and what was actually checked out.
          echo "REQUESTED_TAG=$TARGET_VERSION" >> $GITHUB_ENV

      - name: Apply Colgram Core & Surgical Patches
        # COLGRAM_BUILD_STAMP makes every release identifiable on a phone. Without it all
        # builds share one versionName and it is impossible to tell what a device is running.
        # The patcher exits non-zero if any injection failed, so a release can no longer ship
        # with silently missing features.
        env:
          COLGRAM_BUILD_STAMP: "ci${{ github.run_number }}"
        run: |
          python3 scripts/apply-patches.py Telegram-Src

      - name: Audit Privacy & Check for Trackers
        run: |
          python3 scripts/verify-privacy.py Telegram-Src

      - name: Build Colgram APK
        run: |
          cd Telegram-Src
          chmod +x gradlew
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatRelease --build-cache --parallel -Dorg.gradle.jvmargs="-Xmx4096m -XX:+ParallelRefProcEnabled"

      - name: Audit the built APK for trackers
        # The source audit above cannot catch what it does not look at. Firebase reached every
        # release for the same reason: it is contributed by the google-services Gradle plugin
        # during manifest merging, so no source file contains the string, and the script also
        # runs in advisory mode (no --strict) so findings never failed a build.
        #
        # What is checked here is REGISTRATION, not class presence. The firebase-messaging
        # dependency still ships its classes, and that is inert — Telegram's own code references
        # FirebaseMessaging, so the jar cannot simply be dropped. What made it a beacon was
        # FirebaseInitProvider being merged into the manifest plus an explicit
        # FirebaseApp.initializeApp() call, both of which Colgram now removes. A dex grep for
        # class names would therefore fail on every build while telling us nothing.
        run: |
          APK=$(find Telegram-Src -name "app.apk" -path "*afat/release*" | head -n 1)
          if [ -z "$APK" ]; then echo "::error::No APK to audit"; exit 1; fi
          BT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -n 1)
          MANIFEST=$("$BT" dump xmltree --file AndroidManifest.xml "$APK")
          status=0
          # Components that must NOT be live. Each of these starts network traffic at process
          # creation without any call site of ours.
          for comp in com.google.firebase.provider.FirebaseInitProvider \
                      com.google.android.gms.measurement.AppMeasurementReceiver \
                      com.microsoft.appcenter \
                      io.sentry \
                      com.huawei.hms.push; do
            if echo "$MANIFEST" | grep -qa "$comp"; then
              echo "::error::$comp is registered in the shipped manifest"
              status=1
            else
              echo "clean (not registered): $comp"
            fi
          done
          # Analytics and Crashlytics were removed outright, so their classes SHOULD be absent.
          mkdir -p /tmp/dexaudit && unzip -o -q "$APK" 'classes*.dex' -d /tmp/dexaudit
          for pat in com/google/firebase/crashlytics com/google/android/gms/firebase com/appcenter/android sdk/io/sentry; do
            if grep -qal -- "$pat" /tmp/dexaudit/classes*.dex 2>/dev/null; then
              echo "::error::tracker classes present: $pat"
              status=1
            else
              echo "clean (no classes): $pat"
            fi
          done
          rm -rf /tmp/dexaudit
          exit $status

      - name: Sign APK (Production / Self-Signed)
        run: |
          # The signing identity MUST be constant across releases. It used to be generated
          # fresh here with `keytool -genkey`, so every run produced a DIFFERENT certificate -
          # which made upgrade-in-place impossible (Android refuses an update signed by a
          # different key, so users had to uninstall and lose their local chats), contradicted
          # the release notes that promised in-place upgrades, and broke the anonymity story by
          # making each release a new application identity.
          #
          # The keystore is now a repository secret, base64-encoded. Set it once with:
          #   base64 -w0 colgram.keystore   # paste into secret COLGRAM_KEYSTORE_B64
          # and keep the alias/password secrets alongside it.
          if [ -z "${{ secrets.COLGRAM_KEYSTORE_B64 }}" ]; then
            echo "::error::COLGRAM_KEYSTORE_B64 is not set. Refusing to publish a build with a throwaway signing key."
            exit 1
          fi
          echo "${{ secrets.COLGRAM_KEYSTORE_B64 }}" | base64 -d > colgram.keystore
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner at: $APKSIGNER"
          
          # Find unsigned APK
          UNSIGNED_APK=$(find Telegram-Src -name "*afat*release*.apk" | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            UNSIGNED_APK=$(find Telegram-Src/TMessagesProj_AppStandalone/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          if [ -z "$UNSIGNED_APK" ]; then
            UNSIGNED_APK=$(find Telegram-Src -name "*.apk" | head -n 1)
          fi
          echo "Target APK: $UNSIGNED_APK"
          
          if [ -n "$UNSIGNED_APK" ] && [ -f "$UNSIGNED_APK" ]; then
            $APKSIGNER sign --ks colgram.keystore \
              --ks-pass "pass:${{ secrets.COLGRAM_KEYSTORE_PASS }}" \
              --key-pass "pass:${{ secrets.COLGRAM_KEY_PASS }}" \
              --ks-key-alias "${{ secrets.COLGRAM_KEY_ALIAS }}" \
              --out colgram-signed-release.apk "$UNSIGNED_APK"
            rm -f colgram.keystore
            # Fail the release if the certificate drifted: a silent identity change is the
            # exact bug this step used to introduce on every single run.
            # SHA-256 of the self-signed certificate in the COLGRAM_KEYSTORE_B64 secret.
            # Regenerate with:
            #   keytool -exportcert -keystore colgram.keystore -storepass "$PASS" -alias colgram \
            #           -file cert.cer && sha256sum cert.cer
            # and update this line in the same commit as a new keystore - otherwise the signing
            # step refuses the build, which is the point: an identity change must be deliberate,
            # because Android refuses an in-place upgrade signed by a different key and every
            # user would lose their local chats.
            EXPECTED="b96dec8be5cce45f357df63193320c5732c6b807238d48e730f3b35e5119d91e"
            ACTUAL=$($APKSIGNER verify --print-certs colgram-signed-release.apk | grep -a "certificate SHA-256 digest" | awk '{print $NF}')
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::Signing certificate changed. Expected $EXPECTED, got $ACTUAL."
              exit 1
            fi
            echo "Successfully signed with the expected Colgram identity: $ACTUAL"
          else
            echo "No APK found to sign!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Colgram-Release-APK
          path: colgram-signed-release.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        uses: softprops/action-gh-release@v1
        with:
          files: colgram-signed-release.apk
          tag_name: colgram-${{ env.UPSTREAM_TAG }}-${{ github.run_number }}
          name: Colgram v${{ env.UPSTREAM_TAG }} (Build ${{ github.run_number }})${{ inputs.release_label && format(' {0}', inputs.release_label) || '' }}
          body: |
            ## Colgram Automated Release
            - **Telegram Base**: `${{ env.UPSTREAM_TAG }}` (Official `DrKLO/Telegram`)
            - **Requested version**: `${{ env.REQUESTED_TAG }}`
            - **Hardware Cloaking**: Enabled (Spoofed device & OS info)
            - **Anti-Delete Vault**: Active (Preserves deleted messages & edit logs)
            - **Ghost Mode**: Silent read, stealth typing, offline status, FLAG_SECURE bypass
            - **Storage Sandbox**: Scoped to isolated folder
            - **Built-in MTProto**: Fake-TLS anti-censorship pool active
            - **Telemetry**: 100% Stripped (No Firebase / Play Services / HMS)

            ### Install
            Download `colgram-signed-release.apk` below and install it. The build is
            self-signed with the shared Colgram keystore, so it upgrades in place over
            any earlier Colgram build without uninstalling.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
