name: Build Colgram (Dual-APK Privacy Telegram)

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'config/telegram-native.json'
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      telegram_version:
        description: 'Telegram Upstream Tag or Branch (default: pinned / latest)'
        required: false
        default: 'latest'
      release_label:
        description: 'Optional label appended to the release name (e.g. "Stable")'
        required: false
        default: ''
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: write

jobs:
  build:
    name: Build & Verify Dual Colgram APKs
    runs-on: ubuntu-latest

    steps:
      - name: Free Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /usr/local/lib/android/sdk/ndk/25* /usr/local/lib/android/sdk/ndk/26* || true
          df -h

      - name: Checkout Colgram Mod Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run Host JVM Verification
        run: |
          python3 scripts/host_verify.py --jvm-tests --android-sdk "$ANDROID_HOME"

      - name: Clone Telegram Upstream (Official Base)
        run: |
          TARGET_VERSION="${{ inputs.telegram_version || 'latest' }}"
          PINNED_COMMIT=$(python3 -c "import json; print(json.load(open('config/telegram-native.json'))['telegram_commit'])")
          echo "Target Telegram version: $TARGET_VERSION (pinned commit: $PINNED_COMMIT)"
          if [ "$TARGET_VERSION" = "latest" ] || [ "$TARGET_VERSION" = "pinned" ] || [ -z "$TARGET_VERSION" ]; then
            echo "Cloning pinned Telegram release $PINNED_COMMIT from DrKLO/Telegram..."
            git init Telegram-Src
            cd Telegram-Src
            git remote add origin https://github.com/DrKLO/Telegram.git
            git fetch --depth 1 origin "$PINNED_COMMIT"
            git checkout --detach FETCH_HEAD
            cd ..
          else
            echo "Cloning specific Telegram version $TARGET_VERSION from DrKLO/Telegram..."
            git clone --depth 1 --no-tags --single-branch --branch "$TARGET_VERSION" https://github.com/DrKLO/Telegram.git Telegram-Src
          fi
          cd Telegram-Src
          git submodule update --init --depth 1 TMessagesProj_Modules/media TMessagesProj/lib/jlatexmath
          RAW_VER=$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2 | tr -d '\r' | sed 's/-colgram.*//')
          TAG_VER=$(git describe --tags --always 2>/dev/null || git rev-parse --short HEAD)
          UPSTREAM_TAG="${RAW_VER:-$TAG_VER}"
          echo "UPSTREAM_TAG=$UPSTREAM_TAG" >> "$GITHUB_ENV"
          echo "UPSTREAM_REF=$TAG_VER" >> "$GITHUB_ENV"
          echo "REQUESTED_TAG=$TARGET_VERSION" >> "$GITHUB_ENV"
          echo "Base Telegram Version: $UPSTREAM_TAG (ref: $TAG_VER)"

      - name: Ensure Android SDK Platforms & Licenses
        run: |
          SDK_MGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDK_MGR" ]; then
            yes | "$SDK_MGR" --licenses >/dev/null 2>&1 || true
            if [ ! -f "$ANDROID_HOME/platforms/android-34/android.jar" ]; then
              "$SDK_MGR" "platforms;android-34"
            fi
            if [ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" ]; then
              "$SDK_MGR" "platforms;android-36" "build-tools;36.0.0"
            fi
            if [ ! -d "$ANDROID_HOME/ndk/27.2.12479018" ]; then
              "$SDK_MGR" "ndk;27.2.12479018"
            fi
            if [ ! -d "$ANDROID_HOME/cmake/3.22.1" ]; then
              "$SDK_MGR" "cmake;3.22.1"
            fi
          fi

      - name: Apply Patches (Main APK — No Koliti)
        env:
          COLGRAM_KOLITI: "0"
          COLGRAM_BUILD_STAMP: "ci${{ github.run_number }}"
        run: |
          python3 scripts/apply-patches.py Telegram-Src --no-koliti
          python3 scripts/verify-privacy.py Telegram-Src

      - name: Build Main APK (Universal 4-ABI, Zero Koliti)
        run: |
          rm -rf Telegram-Src/TMessagesProj_AppStandalone/build/intermediates/merged_native_libs \
                 Telegram-Src/TMessagesProj_AppStandalone/build/intermediates/stripped_native_libs \
                 Telegram-Src/TMessagesProj_AppStandalone/build/intermediates/merged_jni_libs \
                 Telegram-Src/colgram-core/build
          cd Telegram-Src
          chmod +x gradlew
          INIT_SCRIPT="$GITHUB_WORKSPACE/.github/gradle/ci-maven-mirror.init.gradle"
          for attempt in 1 2; do
            echo "Main Gradle build attempt $attempt/2..."
            if ./gradlew :TMessagesProj_AppStandalone:assembleAfatRelease \
              --init-script "$INIT_SCRIPT" \
              --build-cache --parallel --max-workers=4 \
              -Dorg.gradle.jvmargs="-Xmx4096m -XX:+ParallelRefProcEnabled" \
              -Dorg.gradle.internal.http.connectionTimeout=120000 \
              -Dorg.gradle.internal.http.socketTimeout=120000; then
              exit 0
            fi
            echo "Main Gradle attempt $attempt failed; waiting 15s before retry..."
            sleep 15
          done
          exit 1

      - name: Audit, Zipalign & Sign Main APK
        env:
          KEYSTORE_B64: ${{ secrets.COLGRAM_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.COLGRAM_KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.COLGRAM_KEY_PASS }}
          KEY_ALIAS: ${{ secrets.COLGRAM_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK=$(find Telegram-Src -name "app.apk" -path "*afat/release*" | head -n 1)
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then echo "::error::No Main APK found"; exit 1; fi
          BT_AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -n 1)
          MANIFEST=$("$BT_AAPT" dump xmltree --file AndroidManifest.xml "$APK")
          status=0
          for comp in com.google.firebase.provider.FirebaseInitProvider \
                      com.google.android.gms.measurement.AppMeasurementReceiver \
                      com.microsoft.appcenter \
                      io.sentry \
                      com.huawei.hms.push; do
            if echo "$MANIFEST" | grep -qa "$comp"; then
              echo "::error::$comp is registered in Main manifest"
              status=1
            fi
          done
          mkdir -p /tmp/dexaudit_main && unzip -o -q "$APK" 'classes*.dex' -d /tmp/dexaudit_main
          for pat in com/google/firebase/crashlytics com/google/android/gms/firebase com/appcenter/android sdk/io/sentry \
                     org/colgram/core/ColgramAiEngine org/colgram/core/ColgramNativeLlama org/colgram/core/ColgramKolitiVoice; do
            if grep -qal -- "$pat" /tmp/dexaudit_main/classes*.dex 2>/dev/null; then
              echo "::error::Forbidden classes present in Main APK DEX: $pat"
              status=1
            fi
          done
          rm -rf /tmp/dexaudit_main
          python3 -c '
          import sys, zipfile
          forbidden = ("libcolgram_llama.so", "libsherpa-onnx-jni.so", "libomp.so", ".gguf", "assets/koliti", "res/raw/koliti_", "sherpa-onnx")
          with zipfile.ZipFile(sys.argv[1]) as zf:
              bad = [n for n in zf.namelist() if any(f in n.lower() for f in forbidden)]
          if bad:
              print("::error::Koliti entries leaked into Main APK:", bad[:10])
              sys.exit(1)
          print("Main APK Koliti exclusion audit: PASS")
          ' "$APK"
          USAGE_TXT="Telegram-Src/TMessagesProj_AppStandalone/build/outputs/mapping/afatRelease/usage.txt"
          if [ -f "$USAGE_TXT" ] && grep -Eq "^go\.(Seq|Universe|error)" "$USAGE_TXT"; then
            echo "::error::R8 stripped go.* JNI bridge classes in Main APK usage.txt"
            grep -E "^go\.(Seq|Universe|error)" "$USAGE_TXT" | head -n 20
            status=1
          fi
          if [ "$status" -ne 0 ]; then exit 1; fi

          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::COLGRAM_KEYSTORE_B64 is not set."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n' | base64 -d > colgram.keystore
          trap 'rm -f colgram.keystore /tmp/colgram-main-aligned.apk' EXIT
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$ZIPALIGN" -f -P 16 4 "$APK" /tmp/colgram-main-aligned.apk
          rm -f "$APK"
          "$ZIPALIGN" -c -P 16 4 /tmp/colgram-main-aligned.apk
          MAIN_OUT="Colgram-${UPSTREAM_TAG}.apk"
          "$APKSIGNER" sign --ks colgram.keystore \
            --ks-type PKCS12 \
            --ks-pass "pass:$KEYSTORE_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --ks-key-alias "$KEY_ALIAS" \
            --out "$MAIN_OUT" /tmp/colgram-main-aligned.apk
          "$ZIPALIGN" -c -P 16 4 "$MAIN_OUT"
          EXPECTED="3c5326960d586b6906a7ab09f7f3039f2385c0c5f8190527614569169e132d41"
          ACTUAL=$("$APKSIGNER" verify --print-certs "$MAIN_OUT" | grep -a "certificate SHA-256 digest" | awk '{print $NF}')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Main APK signing certificate mismatch: $ACTUAL"
            exit 1
          fi
          SIZE=$(stat -c%s "$MAIN_OUT")
          if [ "$SIZE" -ge 2147483648 ]; then
            echo "::error::Main APK exceeds 2 GiB cap ($SIZE bytes)"
            exit 1
          fi
          sha256sum "$MAIN_OUT" > "${MAIN_OUT}.sha256"
          echo "Main APK verified & signed ($SIZE bytes): $MAIN_OUT"

      - name: Stage Offline Koliti Weights & Apply Koliti Patches
        env:
          COLGRAM_KOLITI: "1"
          COLGRAM_BUILD_STAMP: "ci${{ github.run_number }}"
        run: |
          set -euo pipefail
          rm -rf Telegram-Src/TMessagesProj_AppStandalone/build Telegram-Src/colgram-core/build
          mkdir -p Telegram-Src/TMessagesProj_AppStandalone/src/main/assets/koliti
          mkdir -p Telegram-Src/TMessagesProj/src/main/assets
          curl -fSL --retry 3 -o Telegram-Src/TMessagesProj_AppStandalone/src/main/assets/koliti/koliti_core.gguf \
            https://github.com/Kleisym/Colgram/releases/download/koliti-models-v3/koliti-core-v3.gguf
          curl -fSL --retry 3 -o Telegram-Src/TMessagesProj_AppStandalone/src/main/assets/koliti/koliti_vision.gguf \
            https://github.com/Kleisym/Colgram/releases/download/koliti-models-v3/koliti-vision-v3.gguf
          curl -fSL --retry 3 -o /tmp/koliti-voice-pack-v3.tar.gz \
            https://github.com/Kleisym/Colgram/releases/download/koliti-models-v3/koliti-voice-pack-v3.tar.gz
          tar -xzf /tmp/koliti-voice-pack-v3.tar.gz -C Telegram-Src/TMessagesProj/src/main/assets/
          rm -f /tmp/koliti-voice-pack-v3.tar.gz
          python3 scripts/apply-patches.py Telegram-Src --koliti
          python3 scripts/verify-privacy.py Telegram-Src
          python3 -m unittest discover -s scripts -p "test_*.py"

      - name: Build Koliti APK (64-bit Offline Core + Vision + TTS + ASR)
        run: |
          cd Telegram-Src
          chmod +x gradlew
          INIT_SCRIPT="$GITHUB_WORKSPACE/.github/gradle/ci-maven-mirror.init.gradle"
          for attempt in 1 2; do
            echo "Koliti Gradle build attempt $attempt/2..."
            if ./gradlew :TMessagesProj_AppStandalone:assembleAfatRelease \
              -PcolgramAbis=arm64-v8a,x86_64 \
              --init-script "$INIT_SCRIPT" \
              --build-cache --parallel --max-workers=4 \
              -Dorg.gradle.jvmargs="-Xmx4096m -XX:+ParallelRefProcEnabled" \
              -Dorg.gradle.internal.http.connectionTimeout=120000 \
              -Dorg.gradle.internal.http.socketTimeout=120000; then
              exit 0
            fi
            echo "Koliti Gradle attempt $attempt failed; waiting 15s before retry..."
            sleep 15
          done
          exit 1

      - name: Audit, Zipalign & Sign Koliti APK
        env:
          KEYSTORE_B64: ${{ secrets.COLGRAM_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.COLGRAM_KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.COLGRAM_KEY_PASS }}
          KEY_ALIAS: ${{ secrets.COLGRAM_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK=$(find Telegram-Src -name "app.apk" -path "*afat/release*" | head -n 1)
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then echo "::error::No Koliti APK found"; exit 1; fi
          BT_AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -n 1)
          MANIFEST=$("$BT_AAPT" dump xmltree --file AndroidManifest.xml "$APK")
          status=0
          for comp in com.google.firebase.provider.FirebaseInitProvider \
                      com.google.android.gms.measurement.AppMeasurementReceiver \
                      com.microsoft.appcenter \
                      io.sentry \
                      com.huawei.hms.push; do
            if echo "$MANIFEST" | grep -qa "$comp"; then
              echo "::error::$comp is registered in Koliti manifest"
              status=1
            fi
          done
          mkdir -p /tmp/dexaudit_koliti && unzip -o -q "$APK" 'classes*.dex' -d /tmp/dexaudit_koliti
          for pat in com/google/firebase/crashlytics com/google/android/gms/firebase com/appcenter/android sdk/io/sentry; do
            if grep -qal -- "$pat" /tmp/dexaudit_koliti/classes*.dex 2>/dev/null; then
              echo "::error::Tracker classes present in Koliti APK DEX: $pat"
              status=1
            fi
          done
          rm -rf /tmp/dexaudit_koliti
          python3 -c '
          import sys, zipfile
          required_exact = (
              "lib/arm64-v8a/libcolgram_llama.so",
              "lib/arm64-v8a/libsherpa-onnx-jni.so",
              "lib/arm64-v8a/libomp.so",
              "lib/x86_64/libcolgram_llama.so",
              "lib/x86_64/libsherpa-onnx-jni.so",
              "assets/koliti/koliti_core.gguf",
              "assets/koliti/koliti_vision.gguf",
              "assets/koliti_tts/espeak-ng-data.zip",
              "assets/koliti_asr/encoder.int8.onnx",
              "assets/koliti_asr/decoder.onnx",
              "assets/koliti_asr/joiner.int8.onnx",
              "assets/koliti_asr/tokens.txt",
          )
          with zipfile.ZipFile(sys.argv[1]) as zf:
              names = {i.filename: i for i in zf.infolist()}
              forbidden_32 = [n for n in names if n.startswith(("lib/armeabi-v7a/", "lib/x86/"))]
              if forbidden_32:
                  print("::error::Unexpected 32-bit native libraries in Koliti APK:", forbidden_32[:10])
                  sys.exit(1)
              for req in required_exact:
                  if req not in names or names[req].file_size <= 0:
                      print(f"::error::Missing required Koliti payload: {req}")
                      sys.exit(1)
              for gguf in ("assets/koliti/koliti_core.gguf", "assets/koliti/koliti_vision.gguf"):
                  if names[gguf].file_size < 100 * 1024 * 1024:
                      print(f"::error::Truncated GGUF in Koliti APK: {gguf}")
                      sys.exit(1)
          print("Koliti offline asset audit: PASS")
          ' "$APK"
          USAGE_TXT="Telegram-Src/TMessagesProj_AppStandalone/build/outputs/mapping/afatRelease/usage.txt"
          if [ -f "$USAGE_TXT" ] && grep -Eq "^go\.(Seq|Universe|error)" "$USAGE_TXT"; then
            echo "::error::R8 stripped go.* JNI bridge classes in Koliti APK usage.txt"
            grep -E "^go\.(Seq|Universe|error)" "$USAGE_TXT" | head -n 20
            status=1
          fi
          if [ "$status" -ne 0 ]; then exit 1; fi

          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n' | base64 -d > colgram.keystore
          trap 'rm -f colgram.keystore /tmp/colgram-koliti-aligned.apk' EXIT
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$ZIPALIGN" -f -P 16 4 "$APK" /tmp/colgram-koliti-aligned.apk
          rm -f "$APK"
          "$ZIPALIGN" -c -P 16 4 /tmp/colgram-koliti-aligned.apk
          KOLITI_OUT="Colgram-${UPSTREAM_TAG}-Koliti.apk"
          "$APKSIGNER" sign --ks colgram.keystore \
            --ks-type PKCS12 \
            --ks-pass "pass:$KEYSTORE_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --ks-key-alias "$KEY_ALIAS" \
            --out "$KOLITI_OUT" /tmp/colgram-koliti-aligned.apk
          "$ZIPALIGN" -c -P 16 4 "$KOLITI_OUT"
          EXPECTED="3c5326960d586b6906a7ab09f7f3039f2385c0c5f8190527614569169e132d41"
          ACTUAL=$("$APKSIGNER" verify --print-certs "$KOLITI_OUT" | grep -a "certificate SHA-256 digest" | awk '{print $NF}')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Koliti APK signing certificate mismatch: $ACTUAL"
            exit 1
          fi
          SIZE=$(stat -c%s "$KOLITI_OUT")
          if [ "$SIZE" -ge 2147483648 ]; then
            echo "::error::Koliti APK exceeds 2 GiB GitHub cap ($SIZE bytes)"
            exit 1
          fi
          sha256sum "$KOLITI_OUT" > "${KOLITI_OUT}.sha256"
          rm -rf Telegram-Src/TMessagesProj_AppStandalone/src/main/assets/koliti \
                 Telegram-Src/TMessagesProj/src/main/assets/koliti_tts \
                 Telegram-Src/TMessagesProj/src/main/assets/koliti_asr
          echo "Koliti APK verified & signed ($SIZE bytes): $KOLITI_OUT"

      - name: Generate Combined SHA-256 Manifest
        id: apk_sha
        run: |
          MAIN_APK="Colgram-${UPSTREAM_TAG}.apk"
          KOLITI_APK="Colgram-${UPSTREAM_TAG}-Koliti.apk"
          MAIN_SHA=$(cut -d' ' -f1 "${MAIN_APK}.sha256")
          KOLITI_SHA=$(cut -d' ' -f1 "${KOLITI_APK}.sha256")
          cat "${MAIN_APK}.sha256" "${KOLITI_APK}.sha256" > SHA256SUMS.txt
          echo "main_sha256=$MAIN_SHA" >> "$GITHUB_OUTPUT"
          echo "koliti_sha256=$KOLITI_SHA" >> "$GITHUB_OUTPUT"
          echo "::notice title=Main APK SHA-256::$MAIN_SHA"
          echo "::notice title=Koliti APK SHA-256::$KOLITI_SHA"

      - name: Upload Main APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Colgram-Main-APK
          path: |
            Colgram-${{ env.UPSTREAM_TAG }}.apk
            Colgram-${{ env.UPSTREAM_TAG }}.apk.sha256
            SHA256SUMS.txt

      - name: Upload Koliti APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Colgram-Koliti-APK
          path: |
            Colgram-${{ env.UPSTREAM_TAG }}-Koliti.apk
            Colgram-${{ env.UPSTREAM_TAG }}-Koliti.apk.sha256

      - name: Publish Dual-APK GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_LABEL: ${{ inputs.release_label }}
          MAIN_SHA256: ${{ steps.apk_sha.outputs.main_sha256 }}
          KOLITI_SHA256: ${{ steps.apk_sha.outputs.koliti_sha256 }}
        run: |
          set -euo pipefail
          TAG="${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}-ci{1}', env.UPSTREAM_TAG, github.run_number) }}"
          TITLE="Colgram ${UPSTREAM_TAG} (Build ${{ github.run_number }})"
          if [ -n "$RELEASE_LABEL" ]; then
            TITLE="$TITLE — $RELEASE_LABEL"
          fi
          python3 -c '
          import os
          ver = os.environ["UPSTREAM_TAG"]
          main_sha = os.environ.get("MAIN_SHA256", "")
          koliti_sha = os.environ.get("KOLITI_SHA256", "")
          body = (
              f"![Colgram {ver}](https://raw.githubusercontent.com/Kleisym/Colgram/main/docs/media/colgram-release-poster.png)\n\n"
              f"[![Смотреть видео-обзор Colgram {ver} (1080p60)](https://raw.githubusercontent.com/Kleisym/Colgram/main/docs/media/colgram-release-preview.gif)](https://github.com/Kleisym/Colgram/raw/main/docs/media/colgram-release.mp4)\n\n"
              f"### Две сборки Colgram {ver}\n"
              f"- **`Colgram-{ver}.apk`** — Основной Colgram (универсальный 4-ABI, без Koliti AI) · SHA-256: `{main_sha}`\n"
              f"- **`Colgram-{ver}-Koliti.apk`** — Colgram + встроенный офлайн ИИ Koliti (64-bit Core v3 + Vision + TTS + ASR) · SHA-256: `{koliti_sha}`\n"
          )
          with open("/tmp/release_notes.md", "w", encoding="utf-8") as fh:
              fh.write(body)
          '
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file /tmp/release_notes.md
            gh release upload "$TAG" \
              "Colgram-${UPSTREAM_TAG}.apk" \
              "Colgram-${UPSTREAM_TAG}-Koliti.apk" \
              "Colgram-${UPSTREAM_TAG}.apk.sha256" \
              "Colgram-${UPSTREAM_TAG}-Koliti.apk.sha256" \
              "SHA256SUMS.txt" \
              "docs/media/colgram-release.mp4" \
              --clobber
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file /tmp/release_notes.md \
              "Colgram-${UPSTREAM_TAG}.apk" \
              "Colgram-${UPSTREAM_TAG}-Koliti.apk" \
              "Colgram-${UPSTREAM_TAG}.apk.sha256" \
              "Colgram-${UPSTREAM_TAG}-Koliti.apk.sha256" \
              "SHA256SUMS.txt" \
              "docs/media/colgram-release.mp4"
          fi
